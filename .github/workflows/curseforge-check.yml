# Actions > CurseForge check > Run workflow: tests the CurseForge settings the Release
# workflow uses (the CURSEFORGE secret, the PROJECTID variable and the game version)
# without uploading anything.
name: CurseForge check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CURSEFORGE }}
      CF_PROJECT_ID: ${{ vars.PROJECTID }}
      CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS }}
      CF_RELEASE_TYPE: ${{ vars.CF_RELEASE_TYPE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the CurseForge settings
        run: python3 tools/upload_curseforge.py --check
