name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the addon in Lua 5.1 against a mock of Forever's API
        run: |
          python3 -m pip install --quiet lupa
          python3 tools/test/run.py
